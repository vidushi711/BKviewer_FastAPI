<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BK Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="cesiumContainer"></div>
    
     <div id="infoPanel">
        <label for="roomSelect">Select a Room:</label>
        <select id="roomSelect">
            <option value="" disabled selected>Select a room</option>
        </select>
        <p style="margin-top: 10px;">
            You picked: <strong><span id="selectedRoom">—</span></strong>
        </p>
        <p style="margin-top: 10px;">
            Predicted Temp: <strong><span id="predictedTemp">—</span>°C</strong>
        </p>
        <p style="margin-top: 10px;">
            Solar Inflow: <strong><span id="solarInflow">—</span> W</strong>
        </p>
        <p style="margin-top: 10px;">
            Room Volume: <strong><span id="roomVolume">—</span> m³</strong>            
        </p>
        <div style="margin-top: 10px;">
            <strong>Windows:</strong>
            <ul id="windowsUl" style="padding-left: 1em; margin-top: 4px;"></ul>
        </div>
        <!-- loading spinner: hidden until we fire off the fetch -->
        <div id="loadingSpinner" class="spinner-wrapper">
            <span class="spinner-dot"></span>
            <span class="spinner-text">Loading…</span>
        </div>
    </div>
    <div id="temperature-display" style="font-family: sans-serif; font-size: 16px; margin-top: 20px;">
        <!-- Room temperatures will be displayed here -->
    </div>
    <script src="main.js"></script>
</body>
</html>
